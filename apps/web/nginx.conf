server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 20m;

  # API no mesmo domínio: evita CORS e mantém o token fora de terceiros
  location /api/ { proxy_pass http://api:3333; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
  location = /health { proxy_pass http://api:3333; }

  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
}
