  if(v==null||v==='') return null;

function compute(){

    const fp=fuel.filter(f=>f.p===v.p&&f.emp===C.empresa&&inP(f.d));

    const fk=fp.filter(f=>f.kml!=null&&f.kml>0);
    const kml=fk.length?fk.reduce((a,f)=>a+f.AA,0)/fk.reduce((a,f)=>a+f.L,0):null;
    const ev=chron.filter(e=>e.p===v.p&&inP(e.s)&&e.vmax>C.speed);

  });
  const byV=Object.fromEntries(vehicles.map(v=>[v.p,v]));
  // plano de manutenção
  const plan=SNAP.plan.map((b,i)=>{
    const [p,item,iv,lastKm0,lastDate0,prazo,verif,fonte]=b;
    const key=p+'_'+item.normalize('NFD').replace(/[^\w]/g,'').slice(0,28);
    const o=OV.maint[key]; const v=byV[p];
    let lastKm=lastKm0, lastDate=ts(lastDate0), verificar=verif==='Sim', src=fonte;
    if(o){ lastKm=o.lastKm; lastDate=ts(o.lastDate); verificar=false; src='Registrado no SGI'+(o.obs?': '+o.obs:''); }
    const next=(iv!=null&&lastKm!=null)?lastKm+iv:null;
    const due=(prazo!=null&&lastDate!=null)?addMonths(lastDate,prazo):null;
    const kmRest=next!=null&&v?next-v.kmAtual:null;
    const dias=due!=null?Math.floor((due-today)/MS):null;
    const prev=(kmRest!=null&&kmRest>0&&v&&v.kmDia>0)?kmRest/v.kmDia:null;
    let st;
    if(verificar) st='CONFIRMAR'; else if(next==null&&due==null) st='SEM DADO';
    else if((kmRest!=null&&kmRest<0)||(dias!=null&&dias<0)) st='VENCIDO';
    else if((kmRest!=null&&kmRest<=C.kmAlert)||(dias!=null&&dias<=C.dayAlert)||(prev!=null&&prev<=C.dayAlert)) st='ATENÇÃO';
    else st='OK';
    return {key,p,v:v?v.n:'?',item,iv,lastKm,lastDate,prazo,next,due,kmRest,dias,prev,st,src,kmAtual:v?v.kmAtual:null,reg:!!o};
  });
  for(const v of vehicles){ const it=plan.filter(x=>x.p===v.p); v.manut=['VENCIDO','ATENÇÃO','CONFIRMAR','SEM DADO'].find(s=>it.some(x=>x.st===s))||'OK'; }
  const rank={VENCIDO:0,ATENÇÃO:1,CONFIRMAR:2};
  const alerts=plan.filter(x=>x.st in rank).sort((a,b)=>rank[a.st]-rank[b.st]);
  // documentos
  const docs=SNAP.docs.map(d=>{

    const ts_=dt.map(ts).filter(x=>x!=null); const prox=ts_.length?Math.min(...ts_):null;

  });

  // motoristas
  const drivers=SNAP.drivers.map(n=>{

    const tr=trips.filter(t=>t.mot===n&&t.emp===C.empresa&&inP(t.s));

    return {n,cnh:cv||null,cnhSt:cv?(cd<0?'VENCIDA':(cd<=C.docDays?'PRÓXIMA':'OK')):'SEM DADO',viagens:tr.length,km:tr.filter(t=>t.X).reduce((a,t)=>a+t.U,0),occ:ev.length,vmax:ev.length?Math.max(...ev.map(e=>e.vmax)):0,
      abast:fuel.filter(f=>f.mot===n&&inP(f.d)).length,check:RAW.check.filter(r=>normDriver(r[4])===n&&inP(ts(r[0]))).length};
  });
  // custos
  const costs=[...SNAP.costs.map(c=>({id:null,d:ts(c[0]),p:c[1],cat:c[2],desc:c[3],forn:c[4],val:c[5],obs:c[6]})),...OV.costs.map(c=>({id:c.id,d:ts(c.data),p:c.placa,cat:c.cat,desc:c.desc,forn:c.forn,val:num(c.valor),obs:c.obs}))]
    .map(c=>({...c,v:(byV[c.p]||{}).n||'?'})).sort((a,b)=>b.d-a.d);
  // pendências
  const todo=SNAP.todo.map((t,i)=>{const id='t'+i; const st=(OV.todo[id]||{}).status||t[1]; return {id,title:t[0],st,what:t[2]};});
  // verificações
  const cnt=(arr,f)=>arr.filter(f).length;
  const tm=trips.filter(t=>t.emp===C.empresa);
  const fm=fuel.filter(f=>f.emp===C.empresa);
  const review=[
    ['Viagens com algum problema',cnt(tm,t=>t.problem)],
    ['   KM inicial zerado',cnt(tm,t=>/zerado/.test(t.problem))],
    ['   KM fora da faixa do veículo',cnt(tm,t=>/fora da faixa/.test(t.problem))],
    ['   KM final menor que o inicial',cnt(tm,t=>/menor que/.test(t.problem))],
    ['   KM rodados acima do plausível',cnt(tm,t=>/acima do plaus/.test(t.problem))],
    ['   Viagem não encerrada',cnt(tm,t=>/não encerrada/.test(t.problem))],
    ['   Duração acima do limite',cnt(tm,t=>/Duração acima/.test(t.problem))],
    ['   Salto de odômetro entre viagens',cnt(tm,t=>/Salto/.test(t.problem))],
    ['Viagens excluídas dos cálculos de km',cnt(tm,t=>!t.X)],
    ['Abastecimentos com algum problema',cnt(fm,f=>f.problem)],
    ['   Preço/L fora da faixa',cnt(fm,f=>/Preço/.test(f.problem))],
    ['   Consumo fora de 5 a 20 km/L',cnt(fm,f=>/Consumo/.test(f.problem))],
    ['   Observação cita desconto',cnt(fm,f=>/desconto/.test(f.problem))],
    ['   Posto fora da lista',cnt(fm,f=>/Posto/.test(f.problem))],
    ['Motoristas com grafia não cadastrada',cnt(tm,t=>/\(\?\)$/.test(t.mot))],
    ['Placas não reconhecidas',cnt(tm,t=>t.p==='?')]];
  const tx=trips.filter(t=>t.X&&inP(t.s)), fp=fuel.filter(f=>f.emp===C.empresa&&inP(f.d));
  const kpi={viagens:vehicles.reduce((a,v)=>a+v.viagens,0),km:vehicles.reduce((a,v)=>a+v.km,0),comb:fp.reduce((a,f)=>a+(f.V||0),0),
    outros:costs.filter(c=>c.val!=null&&inP(c.d)).reduce((a,c)=>a+c.val,0),occ:chron.filter(e=>inP(e.s)&&e.vmax>C.speed).length,
    abertas:trips.filter(t=>t.status==='Em uso').length,checks:RAW.check.filter(r=>inP(ts(r[0]))).length};
  kpi.total=kpi.comb+kpi.outros; kpi.custoKm=kpi.km>0?kpi.total/kpi.km:null;
  // meses
  const months=[]; { let d=U(Math.min(...fuel.map(f=>f.d),now)); let y=d.getUTCFullYear(),m=d.getUTCMonth(); const nd=U(now); while(y<nd.getUTCFullYear()||(y===nd.getUTCFullYear()&&m<=nd.getUTCMonth())){ months.push(Date.UTC(y,m,1)); m++; if(m>11){m=0;y++;} } }
  const monthly=months.map(m0=>({m:m0,vals:VEH.map(v=>fuel.filter(f=>f.p===v.p&&f.emp===C.empresa&&f.d>=m0&&f.d<addMonths(m0,1)).reduce((a,f)=>a+(f.V||0),0))}));

  return {vehicles,plan,alerts,docs,drivers,costs,todo,review,kpi,monthly,events,trips:[...trips].reverse(),fuel:[...fuel].reverse(),chThrough,lastTrip,from,to:to-MS};
}

function table(id,cols,rows,opts={}){
  const st={q:'',f:'',sort:null,dir:1};
  const fi=opts.filterCol;
  const fopts=fi!=null?[...new Set(rows.map(r=>r[fi]).filter(x=>x!=null&&x!==''))].sort():[];
  const host=document.createElement('div');
  host.innerHTML=`<div class="tools"><input type="search" id="${id}-q" placeholder="Buscar" aria-label="Buscar">
    ${fi!=null?`<select id="${id}-f" aria-label="${esc(opts.filterLabel||'Filtro')}"><option value="">${esc(opts.filterLabel||'Todos')}</option>${fopts.map(o=>`<option>${esc(o)}</option>`).join('')}</select>`:''}${opts.extra||''}</div>
    <div class="tw" ${opts.maxh?`style="max-height:${opts.maxh}px;overflow:auto"`:''}><table><thead><tr>${cols.map((c,i)=>`<th><button data-i="${i}">${esc(c.h)}</button></th>`).join('')}</tr></thead><tbody></tbody></table></div><div class="count"></div>`;
  const draw=()=>{
    let r=rows.filter(row=>(!st.q||row.some(v=>String(v??'').toLowerCase().includes(st.q)))&&(!st.f||String(row[fi])===st.f));
    if(st.sort!==null){const i=st.sort; r=[...r].sort((a,b)=>{const x=a[i],y=b[i]; if(x===y)return 0; if(x==null||x==='')return 1; if(y==null||y==='')return -1; return (x>y?1:-1)*st.dir;});}
    const shown=r.slice(0,opts.limit||400);
    host.querySelector('tbody').innerHTML=shown.map(row=>`<tr>${cols.map((c,i)=>`<td class="${c.n?'n':''} ${c.w?'wide':''}">${c.f?c.f(row[i],row):esc(row[i])}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${cols.length}" class="wide">Nenhum registro para este filtro.</td></tr>`;
    host.querySelector('.count').textContent=`${r.length} registro${r.length===1?'':'s'}`+(r.length>shown.length?` (mostrando ${shown.length})`:'');
  };
  host.addEventListener('input',e=>{if(e.target.id===id+'-q'){st.q=e.target.value.toLowerCase();draw();}if(e.target.id===id+'-f'){st.f=e.target.value;draw();}});
  host.addEventListener('click',e=>{const b=e.target.closest('th button'); if(!b)return; const i=+b.dataset.i; st.dir=st.sort===i?-st.dir:1; st.sort=i; draw();});
  draw(); return host;
}

function stackChart(){
  const names=VEH.map(v=>v.n), mrows=M.monthly;
  const W=520,H=230,L=48,B=28,T=14,R=10,cw=W-L-R,ch=H-T-B;
  const tot=mrows.map(r=>r.vals.reduce((a,b)=>a+b,0)); const max=Math.max(...tot,1);
  const step=(()=>{const s=Math.pow(10,Math.floor(Math.log10(max)));return [1,2,2.5,5,10].map(m=>m*s).find(v=>max/v<=5)||s*10})();
  const top=Math.ceil(max/step)*step; const cols=['var(--c1)','var(--c2)','var(--c3)','var(--c4)'];
  const mn=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez']; let g='';
  for(let v=0;v<=top;v+=step){const y=T+ch-(v/top)*ch; g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${L-6}" y="${y+4}" text-anchor="end" font-size="10.5" fill="var(--muted)">${nf(v)}</text>`;}
  const bw=cw/mrows.length*0.56;
  mrows.forEach((r,i)=>{const x=L+cw/mrows.length*(i+.5)-bw/2; let acc=0;
    r.vals.forEach((v,j)=>{const h=v/top*ch,y=T+ch-acc/top*ch-h; if(h>0) g+=`<rect x="${x}" y="${y}" width="${bw}" height="${h}" fill="${cols[j]}"><title>${esc(names[j])}: ${rs(v)}</title></rect>`; acc+=v;});
    g+=`<text x="${x+bw/2}" y="${H-9}" text-anchor="middle" font-size="11" fill="var(--muted)">${mn[U(r.m).getUTCMonth()]}</text><text x="${x+bw/2}" y="${T+ch-acc/top*ch-4}" text-anchor="middle" font-size="10.5" fill="var(--fg)">${nf(acc)}</text>`;});
  return `<div class="legend">${names.map((n,j)=>`<span><i style="background:${cols[j]}"></i>${esc(n)}</span>`).join('')}</div><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Gasto com combustível por mês e veículo, em reais">${g}</svg><div class="note">O mês corrente é parcial. Valores em reais.</div>`;
}

    w.appendChild(table('dr',[{h:'Motorista'},{h:'CNH',f:chip},{h:'Vencimento',f:v=>fd(v)},{h:'Viagens',n:1},{h:'Km',n:1,f:v=>nf(v)},{h:'Excessos',n:1},{h:'Maior vel. (km/h)',n:1,f:v=>nf(v)},{h:'Abastec.',n:1},{h:'Checklists',n:1},{h:'',f:(v,r)=>`<button class="btn sm" data-act="cnh" data-k="${esc(r[0])}">Editar CNH</button>`}],
      M.drivers.map(d=>[d.n,d.cnhSt,d.cnh,d.viagens,d.km,d.occ,d.vmax,d.abast,d.check])) ); }),
  documentos:()=>W_(w=>{ w.innerHTML=head('Documentos dos veículos','Marque como conferido depois de informar as datas reais. As datas iniciais vieram da planilha antiga e eram provisórias.');
    w.appendChild(table('dc',[{h:'Veículo'},{h:'CRLV',f:v=>fd(v)},{h:'IPVA',f:v=>fd(v)},{h:'Licenciamento',f:v=>fd(v)},{h:'Seguro',f:v=>fd(v)},{h:'Próximo',f:v=>fd(v)},{h:'Dias',n:1},{h:'Status',f:chip},{h:'Dados',f:v=>chip(v==='A confirmar'||!v?'A confirmar':'Conferido')},{h:'',f:(v,r)=>`<button class="btn sm" data-act="doc" data-k="${esc(r[9])}">Editar</button>`}],
      M.docs.map(d=>[d.v,d.crlv,d.ipva,d.lic,d.seguro,d.prox,d.dias,d.st,d.conf,d.p]))); }),
  viagens:()=>W_(w=>{ w.innerHTML=head('Viagens','Registros do Comando de Bordo (Matias Brasil). Linhas com problema ficam fora dos cálculos de km.');
    w.appendChild(table('vg',[{h:'Saída',f:v=>fdt(v)},{h:'Chegada',f:v=>fdt(v)},{h:'Veículo'},{h:'Motorista'},{h:'Km inicial',n:1,f:v=>nf(v)},{h:'Km final',n:1,f:v=>nf(v)},{h:'Duração (h)',n:1,f:v=>nf(v,1)},{h:'Km rodados',n:1,f:v=>nf(v)},{h:'Problema',f:probChip,w:1}],
      M.trips.filter(t=>t.emp===CFG.empresa).map(t=>[t.s,t.c,t.v,t.mot,t.P,t.Q,t.dur,t.X?t.U:null,t.problem]),{filterCol:2,filterLabel:'Todos os veículos',limit:150,maxh:620})); }),
  abastecimentos:()=>W_(w=>{ w.innerHTML=head('Abastecimentos','Preço por litro calculado como valor total dividido pelos litros. Consumo entre abastecimentos consecutivos válidos.');
    w.appendChild(table('ab',[{h:'Data',f:v=>fdt(v)},{h:'Veículo'},{h:'Motorista'},{h:'Km',n:1,f:v=>nf(v)},{h:'Litros',n:1,f:v=>nf(v,1)},{h:'Total',n:1,f:rs},{h:'R$/L',n:1,f:rs},{h:'Posto'},{h:'Km/L',n:1,f:v=>nf(v,1)},{h:'Problema',f:probChip,w:1}],
      M.fuel.filter(f=>f.emp===CFG.empresa).map(f=>[f.d,f.v,f.mot,f.T,f.L,f.V,f.W,f.posto,f.kml,f.problem]),{filterCol:1,filterLabel:'Todos os veículos',limit:100,maxh:620})); }),
  velocidade:()=>W_(w=>{ w.innerHTML=head('Velocidade','Ocorrências acima de '+CFG.speed+' km/h registradas pelo Chronos, com o motorista identificado pelo Comando de Bordo.');
    w.appendChild(table('vl',[{h:'Início',f:v=>fdt(v)},{h:'Veículo'},{h:'Motorista'},{h:'Vel. máx.',n:1,f:v=>nf(v)},{h:'Vel. média',n:1,f:v=>nf(v)},{h:'Duração (h)',n:1,f:v=>nf(v,2)},{h:'Origem',w:1},{h:'Destino',w:1}],
      M.events.map(e=>[e.s,e.v,e.mot,e.vmax,e.vmed,e.dur,e.ei,e.ef]),{filterCol:2,filterLabel:'Todos os motoristas',limit:120,maxh:620,
      extra:`<label class="btn" for="chr-file">Importar Chronos</label><input type="file" id="chr-file" accept=".xlsx,.xls" hidden>`})); }),
  custos:()=>W_(w=>{ w.innerHTML=head('Custos','Custos além do combustível. O combustível vem dos abastecimentos.');
    w.appendChild(table('cs',[{h:'Data',f:v=>fd(v)},{h:'Veículo'},{h:'Categoria'},{h:'Descrição'},{h:'Fornecedor'},{h:'Valor',n:1,f:v=>v==null?'<span class="chip conf">preencher</span>':rs(v)},{h:'Observação',w:1}],
      M.costs.map(c=>[c.d,c.v,c.cat,c.desc,c.forn,c.val,c.obs]),{filterCol:2,filterLabel:'Todas as categorias',extra:`<button class="btn" data-act="cost">Novo custo</button>`})); }),
  pendencias:()=>head('Pendências e qualidade dos dados','Itens que precisam de confirmação e verificações automáticas dos registros.')+
    `<div class="two"><div><h2>Para confirmar</h2><div class="panel todo">${M.todo.map(t=>`<div>${chip(t.st)}<span><b>${esc(t.title)}</b> ${t.st==='Sugestão'?'':`<button class="btn sm" data-act="todo" data-k="${t.id}">${t.st==='Resolvido'?'Reabrir':'Marcar resolvido'}</button>`}</span><p>${esc(t.what)}</p></div>`).join('')}</div></div>
     <div><h2>Verificações dos dados</h2><div class="tw"><table><tbody>${M.review.map(r=>`<tr><td>${esc(r[0])}</td><td class="n">${nf(r[1])}</td></tr>`).join('')}</tbody></table></div></div></div>`,
};
function route(){
  if(!M) return;
  const id=(location.hash||'#painel').slice(1); const v=VIEWS[id]?id:'painel';
  const y=window.scrollY; renderNav(v);
  const out=VIEWS[v](); const m=$('#main'); m.innerHTML=''; typeof out==='string'?m.innerHTML=out:m.appendChild(out);
  if(route.last===v) window.scrollTo(0,y); else window.scrollTo(0,0); route.last=v;
}
window.addEventListener('hashchange',route);

/* ---------- formulários e gravação ---------- */
function form(title,fields,onSave,extraBtn){
  const f=$('#dlgf');
  f.innerHTML=`<h3>${esc(title)}</h3>`+fields.map(x=>x.type==='check'?`<label class="fld chk"><input type="checkbox" name="${x.name}" ${x.value?'checked':''}> ${esc(x.label)}</label>`:
   x.type==='select'?`<label class="fld"><span>${esc(x.label)}</span><select name="${x.name}">${x.options.map(o=>`<option value="${esc(o[0])}" ${o[0]===x.value?'selected':''}>${esc(o[1])}</option>`).join('')}</select></label>`:
   `<label class="fld"><span>${esc(x.label)}</span><input name="${x.name}" type="${x.type||'text'}" value="${esc(x.value??'')}" ${x.step?`step="${x.step}"`:''}></label>`).join('')+
   `<div class="act">${extraBtn?`<button type="button" class="btn" id="dlg-x">${esc(extraBtn.label)}</button>`:''}<button type="button" class="btn" id="dlg-c">Cancelar</button><button type="submit" class="btn pri" value="ok">Salvar</button></div>`;
  const d=$('#dlg'); d.showModal();
  $('#dlg-c').onclick=()=>d.close();
  if(extraBtn) $('#dlg-x').onclick=async()=>{ d.close(); await guard(extraBtn.run); };
  f.onsubmit=async e=>{ e.preventDefault(); const fd_=new FormData(f); const o={}; fields.forEach(x=>{o[x.name]=x.type==='check'?fd_.get(x.name)==='on':fd_.get(x.name);}); d.close(); await guard(()=>onSave(o)); };
}
async function guard(fn){
  if(!DB){ toast('Gravação indisponível nesta visualização.'); return; }
  try{ await fn(); toast('Salvo.'); }catch(e){ toast(e&&e.code==='invalid_argument'?'Sem permissão para gravar. Peça acesso de Contribuidor ao dono da página.':'Não foi possível salvar ('+((e&&e.code)||'erro')+').'); }
}
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]'); if(!b) return; const a=b.dataset.act, k=b.dataset.k;
  if(a==='refresh') return refreshLive(true);
  if(a==='maint'){ const p=M.plan.find(x=>x.key===k); if(!p) return;
    form('Registrar manutenção: '+p.v+' · '+p.item,[{name:'lastKm',label:'Km do serviço',type:'number',value:p.kmAtual??'',step:'1'},{name:'lastDate',label:'Data do serviço',type:'date',value:isoD(todayN())},{name:'obs',label:'Observação (oficina, nota fiscal)',value:''}],
      o=>DB.doc('maint/'+k).set({p:p.p,item:p.item,lastKm:Number(o.lastKm),lastDate:o.lastDate,obs:o.obs||''}),
      p.reg?{label:'Remover registro',run:()=>DB.doc('maint/'+k).delete()}:null); }
  if(a==='cnh'){ const d=M.drivers.find(x=>x.n===k); form('CNH de '+k,[{name:'venc',label:'Vencimento da CNH',type:'date',value:d&&d.cnh?isoD(ts(d.cnh)):''}],o=>DB.doc('cnh/'+encodeURIComponent(k).replace(/%/g,'_')).set({n:k,venc:o.venc})); }
  if(a==='doc'){ const d=M.docs.find(x=>x.p===k); const v=x=>x?isoD(ts(x)):'';
    form('Documentos: '+d.v,[{name:'crlv',label:'CRLV',type:'date',value:v(d.crlv)},{name:'ipva',label:'IPVA',type:'date',value:v(d.ipva)},{name:'lic',label:'Licenciamento',type:'date',value:v(d.lic)},{name:'seguro',label:'Seguro',type:'date',value:v(d.seguro)},{name:'conf',label:'Datas conferidas com o documento',type:'check',value:d.conf!=='A confirmar'&&!!d.conf}],
      o=>DB.doc('docs/'+k).set({crlv:o.crlv||null,ipva:o.ipva||null,lic:o.lic||null,seguro:o.seguro||null,conf:o.conf?'Conferido':'A confirmar'})); }
  if(a==='todo'){ const t=M.todo.find(x=>x.id===k); await guard(()=>DB.doc('todo/'+k).set({status:t.st==='Resolvido'?'Aberto':'Resolvido'})); }
  if(a==='cost'){ form('Novo custo',[{name:'data',label:'Data',type:'date',value:isoD(todayN())},{name:'placa',label:'Veículo',type:'select',value:VEH[0].p,options:VEH.map(v=>[v.p,v.n])},
    {name:'cat',label:'Categoria',type:'select',value:'Manutenção',options:['Manutenção','Conserto','Pneus','Seguro','IPVA','Licenciamento','Multa','Pedágios','Lavação','Outros'].map(x=>[x,x])},{name:'desc',label:'Descrição'},{name:'forn',label:'Fornecedor'},{name:'valor',label:'Valor (R$)',type:'number',step:'0.01'},{name:'obs',label:'NF / observação'}],
    o=>DB.collection('costs').add(o)); }
});
document.addEventListener('change',async e=>{
  if(e.target.id==='per-from'){PER.from=e.target.value;recompute();} if(e.target.id==='per-to'){PER.to=e.target.value;recompute();}
  if(e.target.id==='chr-file'&&e.target.files[0]) importChronos(e.target.files[0]);
});
async function importChronos(file){
  if(!window.XLSX){ toast('Leitor de planilhas não carregou. Verifique a conexão.'); return; }
  try{
    const wb=XLSX.read(await file.arrayBuffer(),{type:'array'}); const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:null});
    const h=rows[0].map(x=>String(x||'').trim()); const ix=n=>h.findIndex(x=>x.startsWith(n));
    const iu=ix('Unidade rastreada'),ii=ix('Data inicial'),idu=ix('Duração'),ivx=ix('Vel. máxima'),ivm=ix('Vel. média'),iei=ix('Endereço inicial'),ief=ix('Endereço final'),ife=ix('Data final');
    if([iu,ii,ivx].some(i=>i<0)){ toast('Arquivo não parece ser o relatório Períodos de utilização do Chronos.'); return; }
    const hrs=v=>{const m=String(v??'').match(/(\d+):(\d\d):(\d\d)/); return m?(+m[1]+m[2]/60+m[3]/3600):0;};
    const ev=[]; let min=Infinity,max=0;
    for(const r of rows.slice(1)){ const s=ts(r[ii]); if(s==null) continue; min=Math.min(min,s); max=Math.max(max,ts(r[ife])||s);
      const vx=num(r[ivx]); if(vx!=null&&vx>CFG.speed) ev.push([r[iu],isoD(s)+'T'+fdt(s).slice(11)+':00',Math.round(hrs(r[idu])*100)/100,vx,num(r[ivm]),r[iei],r[ief]]); }
    const keep=(OV.chronos?OV.chronos.events:SNAP.chronos).filter(e=>ts(e[1])<min);
    let all=[...keep,...ev]; if(JSON.stringify(all).length>230000) all=all.map(e=>[e[0],e[1],e[2],e[3],e[4],'','']);
    await guard(()=>DB.doc('chronos/main').set({events:all,through:max,importedAt:Date.now()}));
  }catch(err){ toast('Não consegui ler o arquivo.'); }
}

/* ---------- Google Drive ao vivo ---------- */
function findB64(x,d=0){
  if(typeof x==='string'){ const s=x.trim(); return (s.length>1000&&s.startsWith('UEsD'))?s:null; }
  if(d>5||x==null||typeof x!=='object') return null;
  for(const k of Object.keys(x)){ const r=findB64(x[k],d+1); if(r) return r; }
  return null;
}
function ingest(res){
  if(!window.XLSX) throw {code:'xlsx',message:'leitor'};
  const b64=findB64(res.payload)||findB64(res.content)||findB64(res.structuredContent);
  if(!b64) throw {code:'format',message:'formato'};
  const wb=XLSX.read(b64,{type:'base64'}); const g=n=>{const ws=wb.Sheets[n]; if(!ws) throw {code:'sheet',message:n}; return XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null}).slice(1).filter(r=>r[0]!=null&&r[0]!=='');};
  RAW={trips:g('Registros'),fuel:g('Abastecimentos'),check:g('manutencao_diaria')};
  LIVE={state:'ok',at:(res.cache&&res.cache.storedAt)||Date.now(),msg:''}; SRC.live=true;
  recompute();
}
function liveFail(err){
  const c=err&&err.code; let msg;
  if(c==='needs_reauth') msg='A conexão com o Google Drive expirou. Reconecte em Configurações > Conectores do Claude. Enquanto isso, mostrando os dados salvos.';
  else if(c==='server_not_connected'||c==='selection_required') msg='O conector do Google Drive não está ligado nesta conta. Adicione em Configurações > Conectores. Mostrando os dados salvos.';
  else if(c==='approval_required'||c==='not_in_manifest'||c==='consent_required'){ msg='A leitura ao vivo precisa da sua autorização para ler o Google Drive.'; }
  else if(c==='sheet') msg='Não achei a aba "'+err.message+'" na planilha do Comando de Bordo. Mostrando os dados salvos.';
  else if(c==='format'||c==='xlsx') msg='O Drive respondeu em um formato que não consegui ler. Mostrando os dados salvos.';
  else msg='Não consegui ler o Google Drive agora ('+(c||'erro')+'). Mostrando os dados salvos e tentando de novo.';
  LIVE={state:'err',msg,needAllow:(c==='approval_required'||c==='not_in_manifest'||c==='consent_required')}; route();
}
let MCP=null;
async function refreshLive(manual){
  if(!MCP){ toast('Leitura ao vivo indisponível nesta visualização.'); return; }
  try{ LIVE={...LIVE,state:LIVE.state==='ok'?'ok':'load',msg:'Atualizando…'}; const res=await MCP.callTool('Google Drive','download_file_content',{fileId:DRIVE_FILE,exportMimeType:XLSX_MIME},{cache:false}); ingest(res); }
  catch(e){ liveFail(e); }
}
async function startLive(){
  try{ MCP=await window.claude?.use('mcp'); }catch(e){ MCP=null; }
  if(!MCP){ LIVE={state:'off',msg:'Leitura ao vivo indisponível nesta visualização. Mostrando os dados salvos em '+fdt(SRC.at)+'.'}; route(); return; }
  MCP.watchTool('Google Drive','download_file_content',{fileId:DRIVE_FILE,exportMimeType:XLSX_MIME},ev=>{
    if(ev.type==='data'){ try{ ingest(ev.result); }catch(e){ liveFail(e); } } else liveFail(ev.error);
  },{refetchInterval:60000,cache:{staleTime:30000,gcTime:300000}});
}
async function startDb(){
  let db=null; try{ db=await window.claude?.use('db'); }catch(e){}
  if(!db) return; DB=db;
  const sub=(path,fn)=>{ try{ db.collection(path).onSnapshot(s=>{fn(s); recompute();},()=>{}); }catch(e){} };
  sub('maint',s=>{OV.maint={}; s.docs.forEach(d=>OV.maint[d.id]=d.data());});
  sub('docs',s=>{OV.docs={}; s.docs.forEach(d=>OV.docs[d.id]=d.data());});
  sub('cnh',s=>{OV.cnh={}; s.docs.forEach(d=>{const x=d.data(); OV.cnh[x.n]=x;});});
  sub('todo',s=>{OV.todo={}; s.docs.forEach(d=>OV.todo[d.id]=d.data());});
  sub('costs',s=>{OV.costs=s.docs.map(d=>({id:d.id,...d.data()}));});
  try{ db.doc('chronos/main').onSnapshot(s=>{OV.chronos=s.exists?s.data():null; recompute();},()=>{}); }catch(e){}
}
SNAP.chronosThrough=Math.max(...SNAP.chronos.map(e=>ts(e[1])));
M=compute(); route();
startDb(); startLive();
setInterval(()=>{ if(!document.hidden && M) recompute(); },5*60*1000);
</script>
